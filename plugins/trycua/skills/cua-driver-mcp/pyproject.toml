[project]
name = "prime-agent-plugin-trycua"
version = "0.1.0"
description = "Prime Agent integration adapter for an existing Try Cua Cua Driver installation."
requires-python = ">=3.10"
dependencies = ["mcp>=1,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cua_driver_mcp"]
